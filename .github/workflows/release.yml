# Pushing a version tag (e.g. `git push origin 2.2.0`) builds the plugin and
# publishes a GitHub release with the three files Obsidian installs, so the
# update reaches everyone. Swap `--notes-file release-notes.md` for `--draft`
# to go back to releases that are published by hand.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Obsidian finds a release by a tag equal to manifest.json's version, with
      # no "v" in front — a tag like v2.0.0 is never offered to anyone.
      - name: Check the tag matches manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version."
            exit 1
          fi

      # The release notes are this version's own section of the changelog.
      - name: Read the release notes from the changelog
        run: |
          awk -v heading="## [$GITHUB_REF_NAME]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
